name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell launchers
        run: bash -n diarize.sh server.sh

      - name: Syntax-check Python sources
        run: python3 -m py_compile scripts/*.py tests/*.py

      - name: Install light test dependencies
        run: pip install "numpy" "soundfile>=0.12.1" "requests>=2.31.0" "av>=11.0.0"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
