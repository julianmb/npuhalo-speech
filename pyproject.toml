[project]
name = "npuhalo-speech"
version = "1.2.0"
description = "NPU-accelerated speech transcription & speaker diarization on AMD Strix Halo — Whisper-v3-turbo on XDNA 2 + pyannote, OpenAI-compatible API and browser studio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Julian M-B", email = "julian@example.com" }]
keywords = ["speech-to-text", "speaker-diarization", "whisper", "pyannote", "amd", "strix-halo", "npu", "xdna2"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "pyannote.audio>=3.1.0",
    "faster-whisper>=1.0.0",
    "av>=11.0.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "silero-vad>=5.0.0",
    "scikit-learn>=1.4.0",
    "rich>=13.7.0",
    "huggingface_hub>=0.23.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "basedpyright>=1.18.0",
    "httpx>=0.27.0",
]
test = [
    "httpx>=0.27.0",
    "numpy",
    "soundfile>=0.12.1",
    "requests>=2.31.0",
    "av>=11.0.0",
]

[project.urls]
Homepage = "https://github.com/julianmb/npuhalo-speech"
Repository = "https://github.com/julianmb/npuhalo-speech"
Issues = "https://github.com/julianmb/npuhalo-speech/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
fixable = ["I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingImports = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.coverage.run]
source = ["scripts"]
branch = true
